name: eVTOL fleet registry refresh

on:
  schedule:
    # Weekly on Mondays at 13:00 UTC — the FAA roster (which N-numbers belong to
    # Joby/Archer/BETA) changes rarely, so this doesn't need to run more often.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evtol_fleet_agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Refresh registry snapshot
        run: python scripts/refresh_registry_snapshot.py

      - name: Commit snapshot if changed
        run: |
          if ! git diff --quiet -- data/tracked_aircraft.json; then
            git config user.name "evtol-fleet-tracker-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/tracked_aircraft.json
            git commit -m "Update tracked eVTOL aircraft registry snapshot [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
