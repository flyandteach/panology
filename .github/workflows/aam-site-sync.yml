name: Sync AAM dashboard flights
on:
  schedule:
    - cron: "0 6 * * *"
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      days:
        description: Completed UTC days to retrieve (1–30)
        default: "2"
        required: false
permissions:
  contents: read
concurrency:
  group: aam-site-flight-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Retrieve OpenSky flights and update the dashboard
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          AAM_SITE_SERVICE_TOKEN: ${{ secrets.AAM_SITE_SERVICE_TOKEN }}
          AAM_SYNC_KEY: ${{ secrets.AAM_SYNC_KEY }}
          SYNC_DAYS: ${{ inputs.days || '2' }}
        run: python evtol_fleet_agent/scripts/sync_to_site.py --days "$SYNC_DAYS"
